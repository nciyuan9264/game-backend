services:
  acquire:
    container_name: backend-acquire
    build:
      context: ./acquire
    ports:
      - '8001:8000' # 容器内部仍然是8000
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_DB=0
    volumes:
      - /var/log/acquire:/app/game_logs
    networks:
      - global-network
    depends_on:
      - redis
    restart: always

  splendor:
    container_name: backend-splendor
    build:
      context: ./splendor
    ports:
      - '8002:8000'
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_DB=1
    volumes:
      - /var/log/splendor:/app/game_logs
    networks:
      - global-network
    depends_on:
      - redis
    restart: always

  redis:
    container_name: backend-redis
    image: redis:7
    ports:
      - '6379:6379'
    networks:
      - global-network
    restart: always

  nginx:
    container_name: backend-nginx
    image: nginx:latest
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/:/etc/nginx/conf.d/:ro
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - global-network
    depends_on:
      - acquire
      - splendor

networks:
  global-network:
    external: true
