services:
  acquire-v2:
    container_name: backend-acquire-v2
    image: ${TCR_LOGIN_SERVER}/tengxuntcr/acquire:latest
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN}
    volumes:
      - /var/log/acquire:/app/game_logs
    networks:
      - global-network
    ports:
      - '8001:8000'
    restart: always

  davinci-v2:
    container_name: backend-davinci-v2
    image: ${TCR_LOGIN_SERVER}/tengxuntcr/davinci:latest
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN}
    volumes:
      - /var/log/da_vinci_code:/app/game_logs
    networks:
      - global-network
    ports:
      - '8000:8000'
    restart: always


networks:
  global-network:
    external: true
