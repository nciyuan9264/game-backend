  davinci-v2:
    container_name: backend-davinci-v2
    build:
      context: .
      dockerfile: deployments/Dockerfile
      args:
        GAME: davinci
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_DB=0
      - POSTGRES_DSN=${POSTGRES_DSN}
    volumes:
      - /var/log/da_vinci_code:/app/game_logs
    networks:
      - global-network
    depends_on:
      - redis
    ports:
      - '8000:8000'
    restart: always

