services:
  acquire:
    container_name: backend-acquire
    build:
      context: .
      dockerfile: deployments/Dockerfile
      args:
        GAME: acquire
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN}
    volumes:
      - /var/log/acquire:/app/game_logs
    networks:
      - global-network
    ports:
      - '8000:8000'
    restart: always

  davinci:
    container_name: backend-davinci
    build:
      context: .
      dockerfile: deployments/Dockerfile
      args:
        GAME: davinci
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN}
    volumes:
      - /var/log/davinci:/app/game_logs
    networks:
      - global-network
    ports:
      - '8001:8000'
    restart: always

  splendor:
    container_name: backend-splendor
    build:
      context: .
      dockerfile: deployments/Dockerfile
      args:
        GAME: splendor
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN}
    volumes:
      - /var/log/splendor:/app/game_logs
    networks:
      - global-network
    ports:
      - '8002:8000'
    restart: always

networks:
  global-network:
    external: true
