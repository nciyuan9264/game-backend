services:
  acquire-v2:
    container_name: backend-acquire-v2
    image: ${TCR_LOGIN_SERVER}/tengxuntcr/acquire:latest
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_DB=0
      - POSTGRES_DSN=${POSTGRES_DSN}
    volumes:
      - /var/log/acquire:/app/game_logs
    networks:
      - global-network
    depends_on:
      - redis
    ports:
      - '8001:8000'
    restart: always

  davinci-v2:
    container_name: backend-davinci-v2
    image: ${TCR_LOGIN_SERVER}/tengxuntcr/davinci:latest
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_DB=0
      - POSTGRES_DSN=${POSTGRES_DSN}
    volumes:
      - /var/log/da_vinci_code:/app/game_logs
    networks:
      - global-network
    depends_on:
      - redis
    ports:
      - '8000:8000'
    restart: always

  redis:
    container_name: backend-redis
    image: redis:7
    ports:
      - '6379:6379'
    networks:
      - global-network
    restart: always


networks:
  global-network:
    external: true
