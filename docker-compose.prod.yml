services:
  acquire:
    image: sgccr.ccs.tencentyun.com/tengxuntcr/acquire:latest
    container_name: backend-acquire
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN}
      - AUTH_CENTER_URL=${AUTH_CENTER_URL:-http://pam-gateway:8080/pam-api/platform/auth}
      - ACQUIRE_LOADTEST_ENABLED=${ACQUIRE_LOADTEST_ENABLED:-false}
      - ACQUIRE_LOADTEST_TOKEN=${ACQUIRE_LOADTEST_TOKEN:-}
      - ACQUIRE_DEBUG_ADDR=${ACQUIRE_DEBUG_ADDR:-}
    volumes:
      - /var/log/acquire:/app/game_logs
    networks:
      - global-network
    restart: always

  davinci:
    image: sgccr.ccs.tencentyun.com/tengxuntcr/davinci:latest
    container_name: backend-davinci
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN}
      - AUTH_CENTER_URL=${AUTH_CENTER_URL:-http://pam-gateway:8080/pam-api/platform/auth}
    volumes:
      - /var/log/davinci:/app/game_logs
    networks:
      - global-network
    restart: always

  splendor:
    image: sgccr.ccs.tencentyun.com/tengxuntcr/splendor:latest
    container_name: backend-splendor
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN}
      - AUTH_CENTER_URL=${AUTH_CENTER_URL:-http://pam-gateway:8080/pam-api/platform/auth}
    volumes:
      - /var/log/splendor:/app/game_logs
    networks:
      - global-network
    restart: always

networks:
  global-network:
    external: true
